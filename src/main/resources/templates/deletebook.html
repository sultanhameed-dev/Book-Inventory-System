<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .custom-nav { background: linear-gradient(135deg, #0d6efd, #0b5ed7); }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 500; }
        .delete-card { background: #ffffff; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-nav navbar-dark p-3 sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/"><i class="fa-solid fa-book-bookmark me-2"></i>BookSpace</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/addBook"><i class="fa-solid fa-plus me-1"></i> Add Book</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="fa-solid fa-magnifying-glass me-1"></i> Search</a></li>
                <li class="nav-item"><a class="nav-link" href="/deleteBook"><i class="fa-solid fa-trash me-1"></i> Delete</a></li>
                <li class="nav-item"><a class="nav-link" href="/info"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 600px;">
    <div class="delete-card p-4 p-md-5">
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-trash-can text-danger me-2"></i>Delete Book</h3>
        <p class="text-muted small mb-4">Warning: This action will permanently remove the record.</p>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/deleteBook}" method="post">
            <div class="mb-4">
                <label class="form-label fw-medium">Book ID</label>
                <input type="text" name="bookid" class="form-control form-control-lg" placeholder="e.g. B101" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2.5 fw-semibold"><i class="fa-solid fa-trash me-2"></i>Delete Book</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
